name: Compila APK

on:
  push:
    branches: [ localeai-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK e CMake (SDK già presente sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "Uso $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Scarica llama.cpp
        run: sh ./setup_llama.sh

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verifica codice Kotlin (veloce)
        run: |
          chmod +x ./gradlew
          ./gradlew compileReleaseKotlin --no-daemon

      - name: Compila APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SAM.apk

      - name: Allega APK alla build
        uses: actions/upload-artifact@v4
        with:
          name: SAM-apk
          path: out/SAM.apk

      - name: Pubblica release scaricabile dal telefono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: localeai-build-${{ github.run_number }}
          name: SAM (APK) build ${{ github.run_number }}
          files: out/SAM.apk
